baseURL = 'https://xiaogongzhuuu.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = "xiaogongzhuuu's Blog"
theme = 'PaperMod'

enableRobotsTXT = true
paginate = 8

[taxonomies]
