<div class="giscus"></div>
<script>
(function () {
  // 在 giscus 脚本执行前,按 PaperMod 当前主题设置对应的自定义主题
  var light = 'https://xiaogongzhuuu.github.io/giscus-light.css';
  var dark = 'https://xiaogongzhuuu.github.io/giscus-dark.css';
  var s = document.getElementById('giscus-script');
  if (s) {
    s.dataset.theme = document.documentElement.classList.contains('dark') ? dark : light;
  }
})();
</script>
<script id="giscus-script" src="https://giscus.app/client.js"
        data-repo="{{ site.Params.giscus.repo }}"
        data-repo-id="{{ site.Params.giscus.repoID }}"
        data-category="{{ site.Params.giscus.category }}"
        data-category-id="{{ site.Params.giscus.categoryID }}"
        data-mapping="{{ site.Params.giscus.mapping }}"
        data-term="{{ site.Params.giscus.term }}"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="https://xiaogongzhuuu.github.io/giscus-light.css"
        data-lang="{{ site.Params.giscus.lang }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
<script>
(function () {
  var light = 'https://xiaogongzhuuu.github.io/giscus-light.css';
  var dark = 'https://xiaogongzhuuu.github.io/giscus-dark.css';
  function isDark() {
    return document.documentElement.classList.contains('dark');
  }
  function sync() {
    var frame = document.querySelector('iframe.giscus-frame');
    if (frame) {
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: isDark() ? dark : light } } },
        'https://giscus.app'
      );
    }
  }
  // 跟随 PaperMod 主题切换(改类名或改本地存储都触发)
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('storage', sync);
  window.addEventListener('load', function () { setTimeout(sync, 600); });
})();
</script>
<style>
.giscus-home {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--entry);
  padding: 1.25rem 1.5rem;
  margin: 0 0 var(--gap) 0;
}
.giscus-home h2 {
  font-size: 1.4rem;
  margin: 0 0 0.25rem;
}
.giscus-home p {
  color: var(--secondary);
  font-size: 0.92rem;
  margin: 0 0 1rem;
}
.giscus-home p a {
  box-shadow: 0 1px 0 var(--secondary);
}
</style>
